name: Build Debug APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 21.0.6113669

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the NDK
        shell: bash
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      # Gradle generates a debug key and adds .debug to the application ID, so this
      # installs beside the upstream app without needing its release signing key.
      - name: Build debug APKs
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube-debug-${{ github.run_number }}
          path: smarttubetv/build/outputs/renamed_apks/stmobileDebug/*.apk
          if-no-files-found: error

      - name: Check translations
        run: ./gradlew --no-daemon :smarttubetv:lintStmobileDebug -PtranslationLint

      - name: Run unit tests
        run: ./gradlew --no-daemon :common:testDebugUnitTest :smarttubetv:testStmobileDebugUnitTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube-debug-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
